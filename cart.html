<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RentLoop | Cart</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar navbar-expand navbar-dark main-nav sticky-top">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">RentLoop</a>
      <div class="navbar-collapse" id="mainNav">
        <ul class="navbar-nav ms-auto align-items-center">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item ms-3"><a class="nav-link active" href="cart.html">Cart</a></li>
          <li class="nav-item ms-3"><a class="nav-link" href="checkout.html">Checkout</a></li>
          <li class="nav-item ms-3"><a class="nav-link" href="return.html">Return</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <section class="page-banner">
    <div class="container text-center">
      <p class="text-warning fw-semibold mb-2">Your Rental Cart</p>
      <h1 class="fw-bold">Review items before checkout</h1>
    </div>
  </section>

  <section class="py-5">
    <div class="container">
      <div class="row g-4">
        <div class="col-lg-8">
          <div class="content-card">
            <div class="d-flex justify-content-between align-items-center mb-3">
              <h3 class="mb-0">Cart Items</h3>
              <button class="btn btn-outline-danger btn-sm" id="clearCartBtn">Clear Cart</button>
            </div>
            <div id="cartItems"></div>
          </div>
        </div>
        <div class="col-lg-4">
          <div class="content-card">
            <h3>Cart Summary</h3>
            <div class="summary-line">
              <span>Total Items</span>
              <strong id="summaryCount">0</strong>
            </div>
            <div class="summary-line">
              <span>Rental Total</span>
              <strong id="summaryTotal">Rs. 0</strong>
            </div>
            <div class="summary-line">
              <span>Service Charge</span>
              <strong>Rs. 99</strong>
            </div>
            <hr>
            <div class="summary-line total-line">
              <span>Grand Total</span>
              <strong id="grandTotal">Rs. 0</strong>
            </div>
            <a href="checkout.html" class="btn btn-warning w-100 mt-3">Proceed to Checkout</a>
          </div>
        </div>
      </div>
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
