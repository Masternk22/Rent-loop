<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RentLoop | Checkout</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar navbar-expand navbar-dark main-nav sticky-top">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">RentLoop</a>
      <div class="navbar-collapse" id="mainNav">
        <ul class="navbar-nav ms-auto align-items-center">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item ms-3"><a class="nav-link" href="cart.html">Cart</a></li>
          <li class="nav-item ms-3"><a class="nav-link active" href="checkout.html">Checkout</a></li>
          <li class="nav-item ms-3"><a class="nav-link" href="return.html">Return</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <section class="page-banner">
    <div class="container text-center">
      <p class="text-warning fw-semibold mb-2">Simple Checkout</p>
      <h1 class="fw-bold">Enter details and place rental order</h1>
    </div>
  </section>

  <section class="py-5">
    <div class="container">
      <div class="row g-4">
        <div class="col-lg-7">
          <div class="content-card">
            <h3 class="mb-4">Customer Details</h3>
            <form id="checkoutForm" class="row g-3">
              <div class="col-md-6">
                <label class="form-label">Full Name</label>
                <input type="text" class="form-control" placeholder="Enter your name" required>
              </div>
              <div class="col-md-6">
                <label class="form-label">Phone Number</label>
                <input type="tel" class="form-control" placeholder="Enter phone number" required>
              </div>
              <div class="col-12">
                <label class="form-label">Email Address</label>
                <input type="email" class="form-control" placeholder="Enter email" required>
              </div>
              <div class="col-12">
                <label class="form-label">Address</label>
                <textarea class="form-control" rows="4" placeholder="Enter delivery address" required></textarea>
              </div>
              <div class="col-md-6">
                <label class="form-label">Rental Start Date</label>
                <input type="date" class="form-control" id="rentalStartDate" required>
              </div>
              <div class="col-md-6">
                <label class="form-label">Payment Method</label>
                <select class="form-select" required>
                  <option value="">Choose method</option>
                  <option>Cash on Delivery</option>
                  <option>UPI</option>
                  <option>Card Payment</option>
                </select>
              </div>
              <div class="col-12">
                <button type="submit" class="btn btn-warning px-4">Place Order</button>
              </div>
            </form>
            <div id="orderMessage" class="alert alert-success mt-4 d-none">
              Your rental order has been placed successfully.
              <div class="mt-3">
                <a href="return.html" class="btn btn-dark btn-sm">Go To Return Page</a>
              </div>
            </div>
          </div>
        </div>
        <div class="col-lg-5">
          <div class="content-card">
            <h3>Order Summary</h3>
            <div id="checkoutItems" class="mb-3"></div>
            <div class="summary-line">
              <span>Items</span>
              <strong id="checkoutCount">0</strong>
            </div>
            <div class="summary-line">
              <span>Rental Total</span>
              <strong id="checkoutTotal">Rs. 0</strong>
            </div>
            <div class="summary-line">
              <span>Delivery</span>
              <strong>Free</strong>
            </div>
            <div class="summary-line">
              <span>Service Charge</span>
              <strong>Rs. 99</strong>
            </div>
            <hr>
            <div class="summary-line total-line">
              <span>Total Payable</span>
              <strong id="checkoutGrandTotal">Rs. 0</strong>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
